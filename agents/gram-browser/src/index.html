<!DOCTYPE html>
<html lang="en" style="overflow: hidden; height: 100%;">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>TON AI Gram</title>
  <script>
    (function(){
      try {
        var m = document.cookie.match(/(?:^|;\s*)tg-theme=([^;]*)/);
        if (m) {
          var t = m[1];
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.background = t === 'light' ? '#ffffff' : '#121212';
        }
      } catch(e) {}
    })();
  </script>
</head>
<body style="overflow: hidden; margin: 0; height: 100%;">

</body>
</html>
