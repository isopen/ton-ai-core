[package]
name = "durev-core"
version = "0.1.0"
edition = "2021"
description = "durev-core review engine for TON AI Core"
license = "MIT"

[lib]
name = "durev_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "durev"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
wasm = ["dep:wasm-bindgen"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
