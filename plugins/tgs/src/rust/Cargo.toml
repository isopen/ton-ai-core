[package]
name = "tgs"
version = "0.1.0"
edition = "2021"
description = "TGS (Telegram Lottie) parser and animation core, wasm-ready"
publish = false

[lib]
name = "tgs"
crate-type = ["rlib", "cdylib"]

[dependencies]

[features]
prof = []

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
overflow-checks = false
